<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<link rel="stylesheet" href="calci.css">

<body>
    <div class="container">
        <div class="screen">
        <input id="display" type="text" name="display" readonly>
        </div>
        <div class="buttoning">
            <div class="column">
                <div class="tab">
                <input class="button digits" type="button" value="7" onclick="display.value += '7'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="4" onclick="display.value += '4'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="1" onclick="display.value += '1'">
                </div>
                <div class="tab1">
                    <input id="clearButton" class="button" type="button" value="C" onclick="display.value = ''">
                </div>
            </div>
            <div class="column">
                <div class="tab">
                    <input class="button digits" type="button" value="8" onclick="display.value += '8'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="5" onclick="display.value += '5'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="2" onclick="display.value += '2'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="0" onclick="display.value += '0'">
                </div>
            </div>
            <div class="column">
                <div class="tab">
                    <input class="button digits" type="button" value="9" onclick="display.value += '9'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="6" onclick="display.value += '6'">
                </div>
                <div class="tab">
                    <input class="button digits" type="button" value="3" onclick="display.value += '3'">
                </div>
                <div class="tab2">
                    <input class="button mathButtons" type="button" value="=" onclick="display.value = eval(display.value)">
                </div>
            </div>
            <div class="column">
                <div class="tab2">
                    <input class="button mathButtons" type="button" value="+" onclick="display.value += '+'">
                </div>
                <div class="tab2">
                    <input class="button mathButtons" type="button" value="-" onclick="display.value += '-'">
                </div>
                <div class="tab2">
                    <input class="button mathButtons" type="button" value="*" onclick="display.value += '*'">
                </div>
                <div class="tab2">
                    <input class="button mathButtons" type="button" value="/" onclick="display.value += '/'">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
