<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Netflix India</title>
</head>
<link rel="stylesheet" href="netflixsignin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<link href="https://fonts.cdnfonts.com/css/netflix-font" rel="stylesheet">

<body>
    <div class="container">
        <div class="head">
            <div class="left">
                <img src="netflix-logo-png-2562.png" height="60px" width="200px">
            </div>
        </div>
        <div class="hero">
            <div class="signform">
                <div class="form">
                    <div class="title">
                        <h2>Sign In</h2>
                    </div>
                    <br><br>
                    <div class="btn">
                        <input type="email" type="number" value="Enter email or phone number">
                        <br>
                        <input type="password" value="Password" placeholder="Password">
                    </div>
                    <br><br>
                    <div class="subbtn">
                        <button>Sign In</button>
                        <br>
                        <div class="content">
                            <div class="left">
                                <input type="checkbox">Remember me
                            </div>
                            <div class="right">
                                Need help?
                            </div>
                        </div>
                    </div>
                    <br><br><br>
                    <div class="about">
                        <spanall>New to Netflix? <span>Sign up now.</span></spanall><br>
                        <br>
                        <span1>This page is protected by Google reCAPTCHA to<br>
                            ensure you are not a bot.</span1>
                        <span2>Learn More</span2>
                    </div>
                </div>
            </div>
        </div>
        <div class="end">
            <div class="top">
                <span>Questions? Call <span1>000-800-919-1694</span1></span>
            </div>
            <div class="footer">
                <div class="footersection">
                    <ul>
                        <li>FAQ</li>
                        <li>Cookie Preferences</li>
                    </ul>
                </div>
                <div class="footersection">
                    <ul>
                        <li>Help Centre</li>
                        <li>Corporate Information</li>
                    </ul>
                </div>
                <div class="footersection">
                    <ul>
                        <li>Terms of Use</li>
                    </ul>
                </div>
                <div class="footersection">
                    <ul>
                        <li>Privacy</li>
                    </ul>
                </div>
            </div>
            <div class="last">
                <button><select name="languages">
                        <option value="eng">English</option>
                        <option value="hindi">Hindi</option>
                    </select></button>
            </div>
        </div>
    </div>
</body>

</html>
